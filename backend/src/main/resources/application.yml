spring:
  application:
    name: campushub
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/campushub?sslMode=REQUIRED&characterEncoding=UTF-8&connectionTimeZone=UTC
    username: campushub_app
    password: ${CH_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: false
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: 8080
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
mybatis:
  type-handlers-package: com.campushub.activity
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  level:
    root: INFO
    com.campushub: INFO
campushub:
  auth:
    demo-enabled: false
