# Install inside nginx http{} after replacing campus.example.edu and certificate paths.
# No query strings, user identities, cookies, authorization headers or bodies in logs.
log_format campushub '$time_iso8601 $request_method $uri $status $request_time';
limit_req_zone $binary_remote_addr zone=ch_public:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ch_login:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=ch_write:10m rate=2r/s;

server {
    listen 80;
    server_name campus.example.edu;
    return 308 https://campus.example.edu$request_uri;
}
server {
    listen 443 ssl;
    server_name campus.example.edu;
    ssl_certificate /etc/letsencrypt/live/campus.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/campushub/current/admin-web;
    client_max_body_size 32k;
    access_log /var/log/nginx/campushub-access.log campushub;
    error_log /var/log/nginx/campushub-error.log warn;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    limit_req_status 429;

    # Closed by default. Replace allow with your VPN / trusted operator egress CIDR.
    location = /api/v1/auth/login {
        allow 127.0.0.1;
        deny all;
        limit_req zone=ch_login burst=3 nodelay;
        include /etc/nginx/snippets/campushub-proxy.conf;
    }
    location = /api/v1/auth/wechat-login {
        limit_req zone=ch_login burst=3 nodelay;
        include /etc/nginx/snippets/campushub-proxy.conf;
    }
    location = /api/v1/auth/demo-login { return 404; }
    location /api/v1/manage/ {
        allow 127.0.0.1;
        deny all;
        limit_req zone=ch_write burst=5 nodelay;
        include /etc/nginx/snippets/campushub-proxy.conf;
    }
    location /api/ {
        limit_req zone=ch_public burst=20 nodelay;
        include /etc/nginx/snippets/campushub-proxy.conf;
    }
    location /actuator/ { return 404; }
    location /v3/ { return 404; }
    location /swagger-ui { return 404; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
